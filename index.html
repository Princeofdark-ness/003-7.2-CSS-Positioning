<!DOCTYPE html>
<html>

<head>
  <title>CSS Positioning Exercise</title>
  <style>
    /* Write your code here */

    body{
      overflow: hidden;
    }

    .blue-box{
      background: blue;
      width: 500px;
      height: 300px;
      position: absolute;
      left: 200px;
      top: 200px;
    }

    .red-circle{
      background: red;
      width: 250px;
      height: 250px;
      border-radius: 50%;
      position: relative;
      left: 250px;
      top: 150px;
    }

  </style>
</head>

<body>
  <div class="blue-box">
    <div class="red-circle">
    </div>
  </div>

</body>

</html>
